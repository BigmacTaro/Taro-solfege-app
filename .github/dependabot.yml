version: 2
updates:
  # 依存パッケージ(React・Tone.js・VexFlow など)。更新があれば Pull Request を作る。
  # ライセンス表記ページは、ビルドのたびに自動で作り直される。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
