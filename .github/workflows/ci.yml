name: CI

# main 以外のブランチへの push と、すべての Pull Request で、テストとビルドを確認する
# (main への push は、deploy.yml がテストとビルドをしてから公開する)
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
